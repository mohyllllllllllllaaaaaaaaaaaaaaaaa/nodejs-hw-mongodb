post:
  tags:
    - Auth
  summary: User login
  operationId: loginUser
  description: Logs in user and returns access and refresh tokens
  security: []  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
  responses:
    '200':
      description: Successful login
    '401':
      description: Invalid email or password
