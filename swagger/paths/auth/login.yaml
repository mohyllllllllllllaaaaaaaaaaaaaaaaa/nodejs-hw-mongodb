post:
  tags:
    - Auth
  summary: User login
  operationId: loginUser
  description: Logs in user and returns access and refresh tokens
  security: []  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
  responses:
    '200':
     description: Successful login
     content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in a user!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: iMmj6vRqkY2WcWnhBbyjJGMRN626itn9U2Qmc9Dc

    '400':
     description: Validation error
     content:
      application/json:
        schema:
          $ref: '../../components/respons/auth-400.yaml'
    '401':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: User not found
    '500':
     description: Server error
     content:
      application/json:
        schema:
          $ref: ../../components/respons/500.yaml       