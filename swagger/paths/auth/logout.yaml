post:
  tags:
    - Auth
  summary: Logout
  operationId: logoutUser
  description: Deletes user's session
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Successfully logged out
    '401':
      description: Session not found
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Session not found 
    '500':
     description: Server error
     content:
      application/json:
        schema:
          $ref: ../../components/respons/500.yaml