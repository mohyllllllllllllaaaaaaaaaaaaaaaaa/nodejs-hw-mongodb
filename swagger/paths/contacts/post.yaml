tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Adds a new contact to the user's list.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: ../../components/schemas/ContactCreate.yaml
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/contact.yaml
  '400':
    description:  Bad Request
    content:
      application/json:
        schema:
          $ref: '../../components/respons/400.yaml'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/respons/401.yaml'
