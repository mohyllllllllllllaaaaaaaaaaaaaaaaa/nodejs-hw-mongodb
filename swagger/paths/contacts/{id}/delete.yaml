tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Deletes a user contact by ID.
security:
  - bearerAuth: []
parameters: 
  - name: id 
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
responses:
  '204':
    description: Contact successfully deleted (no response body)
  '404':
    description: Not found contact
    content:
      application/json:
        schema:
          $ref: ../../../components/respons/404.yaml

