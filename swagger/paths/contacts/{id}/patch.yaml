tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Updates contact data by ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
requestBody:
  required: true
  content:
     multipart/form-data:
      schema:
        $ref: ../../../components/schemas/updateContact.yaml
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Not found contact
    content:
      application/json:
        schema:
          $ref: ../../../components/respons/400.yaml        
  '404':
     description: Not found contact
     content:
       application/json:
         schema:
           $ref: '../../../components/respons/404.yaml'
  '500':
    description: Not found contact
    content:
      application/json:
        schema:
          $ref: ../../../components/respons/500.yaml