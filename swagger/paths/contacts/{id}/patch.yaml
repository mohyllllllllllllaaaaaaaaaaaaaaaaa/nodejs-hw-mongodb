tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Updates contact data by ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Unique ID of the contact
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/contact.yaml
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '404':
    description: Contact not found
